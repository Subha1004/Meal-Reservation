name: Meal Reservation Reminder

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger reminder endpoint
        env:
          APP_URL: https://meal-reservation.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --show-error -v \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/meal-reminders"
